api:
  replicaCount: 1
  image:
    repository: 792373136340.dkr.ecr.us-west-2.amazonaws.com/oms-marvell-api
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

web:
  replicaCount: 1
  image:
    repository: 792373136340.dkr.ecr.us-west-2.amazonaws.com/oms-marvell-web
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  host: oms-marvell-dev.agent.opsera.dev
