apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: {{ .Release.Name }}-web
  ports:
  - port: {{ .Values.web.service.port }}
    targetPort: {{ .Values.web.service.port }}
    protocol: TCP
